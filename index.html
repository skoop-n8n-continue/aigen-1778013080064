<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="./manifest.json">
  <!-- skoop-live-runtime -->
  <script src="./skoop-live.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app-container">
        <header class="header">
            <img class="logo" data-bind-src="storefront.logo" alt="Logo">
            <h1 class="company-name" data-bind-text="storefront.company_name"></h1>
        </header>

        <main class="hero-section">
            <h2 class="headline" data-bind-text="hero.headline"></h2>
            <p class="message" data-bind-text="hero.message"></p>
        </main>

        <footer class="footer">
            <p>&copy; 2026 <span data-bind-text="storefront.company_name"></span></p>
        </footer>
    </div>

    <script src="script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js')
          .then(function (reg) { console.log('[PWA] SW registered:', reg.scope); })
          .catch(function (err) { console.warn('[PWA] SW registration failed:', err); });
      });
    }
  </script>
</body>
</html>
